<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700;900&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:"Noto Sans JP",sans-serif;color:#fff;position:relative;
  background:linear-gradient(150deg,#0a1a34 0%,#0f2444 48%,#1b3a67 120%);
  display:flex;align-items:center;padding:0 84px;
}
body::before{content:"";position:absolute;inset:0;
  background:radial-gradient(560px 300px at 90% 8%,rgba(176,138,78,.28),transparent 70%)}
.topline{position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,transparent,#c9a86a 30%,#e8cfa0 50%,#c9a86a 70%,transparent)}
.inner{position:relative;z-index:2;display:flex;align-items:center;gap:64px;width:100%}
.left{flex:1}
.kicker{display:flex;align-items:center;gap:16px;color:#d8c19a;font-weight:700;
  font-size:19px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:30px}
.kicker::before{content:"";width:44px;height:2px;background:#d8c19a}
h1{font-family:"Noto Serif JP";font-weight:900;font-size:52px;line-height:1.5;letter-spacing:.01em}
h1 em{font-style:normal;color:#e8cfa0;border-bottom:3px solid rgba(216,193,154,.5)}
.role{font-family:"Noto Serif JP";font-weight:700;font-size:27px;color:#dbe3ef;margin-top:30px;letter-spacing:.02em}
.name{margin-top:22px;font-size:22px;color:#fff;font-weight:700}
.name span{color:#d8c19a;font-weight:500;font-size:18px;margin-left:12px}
.foot{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
.foot .tag{border:1px solid rgba(216,193,154,.45);color:#e8cfa0;font-size:16px;padding:7px 16px;border-radius:4px}
.right{flex-shrink:0}
.photo{width:300px;height:300px;border-radius:50%;object-fit:cover;object-position:56% 20%;
  border:4px solid rgba(216,193,154,.6);background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="topline"></div>
<div class="inner">
  <div class="left">
    <div class="kicker">Career Counseling &amp; Lecture</div>
    <h1>未経験からのIT転職を、<br><em>面談で伴走</em>する。</h1>
    <div class="role">現役エンジニア × 国家資格キャリアコンサルタント</div>
    <div class="name">Yoshi（ヨシ）<span>福岡・全国オンライン対応</span></div>
    <div class="foot">
      <div class="tag">キャリア面談</div>
      <div class="tag">IT転職相談</div>
      <div class="tag">講演・セミナー</div>
    </div>
  </div>
  <div class="right">
    <img class="photo" src="profile.jpg" alt="Yoshi" />
  </div>
</div>
</body>
</html>
